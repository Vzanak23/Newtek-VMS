          <form class="form-inline my-2 my-lg-0">
            <div class="live-clock"  style="margin-right: 15px;">

        </form>
        </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
          // Get the current URL path
          var currentUrl = window.location.pathname;
  
          // Define the mapping between URL paths and menu IDs
          var menuMapping = {
              '/PlatForm/':'plat',
              '/model/': 'model',
              '/part/': 'part',
              '/Check/': 'check',
              '/employee_master/': 'emp_master',
              '/model_part_selection/': 'emp_model',
              '/Report_screen/': 'emp_report',
              '/admin_shift/': 'shift',
              '/Image_pro/': 'IMG',
              // Add mappings for other menu items
          };
  
          // Find the corresponding menu item and mark it as active
          var menuItemId = menuMapping[currentUrl];
          if (menuItemId) {
              var menuItem = document.getElementById(menuItemId);
              if (menuItem) {
                  menuItem.classList.add('active');
              }
          }
      });

      function updateClock() {
        const clock = document.getElementById("clock");
        const date = document.getElementById("date");
        const now = new Date();

        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const seconds = now.getSeconds().toString().padStart(2, '0');
        clock.textContent = `${hours}:${minutes}:${seconds}`; 

        const year = now.getFullYear();
        const month = (now.getMonth() + 1).toString().padStart(2, '0');
        const day = now.getDate().toString().padStart(2, '0');
        date.textContent = `${day}/${month}/${year}`;

    }

    setInterval(updateClock, 1000); // Update the clock every second
    updateClock(); // Initial call to display the time immediately
    
        function toggleSidebar() {
            var sidebar = document.getElementById("sidebar");
            if (sidebar.style.display === "none" || sidebar.style.display === "") {
                sidebar.style.display = "block";
            } else {
                sidebar.style.display = "none";
            }
        }



  </script>
